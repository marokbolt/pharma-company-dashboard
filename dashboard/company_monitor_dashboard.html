<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nextyn Biopharma Company Monitor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#111827; --muted:#4b5563; --faint:#6b7280; --rule:#e5e7eb; --rule2:#eef0f2;
  --accent:#0b5394; --accent2:#0e8a6d; --amber:#8a6a0f; --red:#a3281e; --bg:#ffffff; --bgsoft:#f7f8fa;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.page{max-width:1180px;margin:0 auto;padding-block:16px 60px;}
.brand-header{display:flex;align-items:center;justify-content:center;padding-top:14px;padding-bottom:2px;}
.brand-header img{height:30px;width:auto;display:block;}
header.masthead{padding-bottom:14px;padding-top:12px;text-align:center;}
header.masthead h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.2px;}
header.masthead .sub{margin-top:4px;color:var(--muted);font-size:14px;}
.meta-row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--faint);}
.meta-row span{white-space:nowrap;}
.disclosure{margin-top:12px;background:#fbf3e2;border:1px solid #f0dfb0;border-radius:6px;padding:9px 14px;font-size:12px;color:#6b5213;max-width:900px;margin-inline:auto;text-align:center;}

.tabs{display:flex;gap:2px;margin-top:22px;border-bottom:1px solid var(--rule);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px;}
.tab-btn{font-family:var(--font-ui);font-size:12.5px;font-weight:600;padding:9px 14px;border:none;background:transparent;color:var(--faint);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.panel{display:none;padding-top:22px;}
.panel.active{display:block;}

.tab-dropdown{position:relative;}
.tab-dropdown .caret{font-size:9px;margin-left:3px;position:relative;top:-1px;}
.dropdown-menu{display:none;position:absolute;top:100%;left:0;margin-top:2px;background:#fff;border:1px solid var(--rule);border-radius:6px;box-shadow:0 6px 20px rgba(17,24,39,.12);min-width:230px;z-index:30;padding:5px;}
.dropdown-menu.open{display:block;}
.dropdown-menu .tab-btn{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:4px;border-bottom:none;margin-bottom:0;}
.dropdown-menu .tab-btn:hover{background:#f2f6fa;}
.dropdown-menu .tab-btn.active{background:#eaf1fb;}

.search-wrap{position:relative;margin-left:auto;align-self:center;display:flex;align-items:center;gap:6px;}
#co-search{font-family:var(--font-ui);font-size:12.5px;padding:7px 10px;border:1px solid var(--rule);border-radius:5px;width:210px;color:var(--ink);}
#co-search:focus{outline:none;border-color:var(--accent);}
.search-results{display:none;position:absolute;top:100%;right:0;margin-top:5px;background:#fff;border:1px solid var(--rule);border-radius:6px;box-shadow:0 6px 20px rgba(17,24,39,.14);min-width:270px;max-height:320px;overflow-y:auto;z-index:40;}
.search-results.open{display:block;}
.search-result-item{padding:8px 12px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--rule2);}
.search-result-item:last-child{border-bottom:none;}
.search-result-item:hover{background:#eef4fa;}
.search-result-item .tkr{margin-right:7px;}
.search-result-item .nm{color:var(--faint);}
.search-empty{padding:10px 12px;font-size:12px;color:var(--faint);}
@media (max-width:720px){ .search-wrap{width:100%;margin-left:0;order:99;} #co-search{width:100%;} }

/* ---- compare icon button (next to search) ---- */
.compare-icon-btn{position:relative;display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;border:1px solid var(--rule);border-radius:5px;background:#fff;color:var(--muted);cursor:pointer;padding:0;}
.compare-icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.compare-icon-badge{position:absolute;top:-6px;right:-6px;display:none;background:var(--accent);color:#fff;border-radius:8px;font-size:9.5px;font-weight:700;padding:1px 5px;min-width:14px;text-align:center;line-height:1.3;}
.compare-icon-badge.show{display:block;}
.compare-icon-tip{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:4px;white-space:nowrap;z-index:50;}
.compare-icon-btn:hover .compare-icon-tip{display:block;}

.cmp-modal .modal-card{max-width:980px;}
.cmp-pick-search{width:100%;font-family:var(--font-ui);font-size:13px;padding:8px 10px;border:1px solid var(--rule);border-radius:5px;margin-bottom:10px;}
.cmp-pick-list{max-height:360px;overflow-y:auto;border:1px solid var(--rule);border-radius:6px;}
.cmp-pick-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--rule2);cursor:pointer;font-size:12.5px;}
.cmp-pick-row:last-child{border-bottom:none;}
.cmp-pick-row:hover{background:#f7f9fb;}
.cmp-pick-row.checked{background:#eaf1fb;}
.cmp-pick-row input{pointer-events:none;}
.cmp-pick-row .nm{color:var(--faint);flex:1;}
.cmp-pick-row.disabled{opacity:.4;cursor:not-allowed;}
.cmp-pick-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
.cmp-pick-foot .hint{font-size:11.5px;color:var(--faint);}
.cmp-go-btn{font-family:var(--font-ui);font-size:12.5px;font-weight:600;padding:9px 18px;border:none;border-radius:5px;background:var(--accent);color:#fff;cursor:pointer;}
.cmp-go-btn:disabled{background:var(--rule);color:var(--faint);cursor:not-allowed;}
.cmp-back{font-family:var(--font-ui);font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;margin-bottom:12px;}
.cmp-back:hover{text-decoration:underline;}
.cmp-table{width:100%;border-collapse:collapse;table-layout:fixed;}
.cmp-table th,.cmp-table td{border:1px solid var(--rule);padding:9px 12px;vertical-align:top;font-size:12.5px;text-align:left;}
.cmp-table th.cmp-param{width:150px;background:var(--bgsoft);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;vertical-align:middle;}
.cmp-table th.cmp-co{background:var(--bgsoft);text-align:left;}
.cmp-table th.cmp-co .tkr{display:block;font-size:14px;}
.cmp-table th.cmp-co .nm{display:block;color:var(--faint);font-weight:400;font-size:11px;margin-top:2px;}
.cmp-table tr.cmp-section td{background:var(--bgsoft);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);}
.cmp-drug-row{margin-bottom:5px;}
.cmp-drug-row:last-child{margin-bottom:0;}
.cmp-drug-row .nm{font-weight:600;color:var(--ink);}
.cmp-drug-row .st{display:block;color:var(--faint);font-size:11px;}

/* ---- pipeline timeline (gantt) ---- */
.gantt-head{display:grid;grid-template-columns:230px repeat(9,1fr);gap:0;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:2px;position:sticky;top:0;background:var(--bg);z-index:3;}
.gantt-head .gh-label{font-size:9.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;text-align:center;padding:0 2px;cursor:pointer;border-radius:3px;}
.gantt-head .gh-label:hover{background:#eaf1fb;color:var(--accent);}
.gantt-group{margin-top:14px;}
.gantt-group-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:4px;padding-top:6px;border-top:1px solid var(--rule);}
.gantt-group-title.clickable{cursor:pointer;}
.gantt-group-title.clickable:hover{text-decoration:underline;}
.gantt-group:first-child .gantt-group-title{border-top:none;padding-top:0;}
.gantt-row{display:grid;grid-template-columns:230px repeat(9,1fr);align-items:center;gap:0;padding:5px 0;border-bottom:1px solid var(--rule2);position:relative;}
.gantt-row .gr-label{font-size:12px;padding-right:10px;line-height:1.3;}
.gantt-row .gr-label .pg{display:block;color:var(--ink);font-weight:600;}
.gantt-row .gr-label .ind{display:block;color:var(--faint);font-size:10.5px;}
.gantt-row .gr-label.clickable{cursor:pointer;}
.gantt-row .gr-label.clickable:hover .pg{text-decoration:underline;color:var(--accent);}
.gantt-bar-wrap{grid-column:2 / span 9;position:relative;height:20px;cursor:pointer;}
.gantt-gridlines{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);}
.gantt-gridlines div{border-left:1px solid var(--rule2);}
.gantt-bar{position:absolute;top:3px;height:14px;border-radius:3px;background:var(--accent);display:flex;align-items:center;transition:filter .1s;}
.gantt-bar-wrap:hover .gantt-bar{filter:brightness(0.85);}
.gantt-bar.k-done{background:var(--accent2);}
.gantt-bar.k-warn{background:#c98a1f;}
.gantt-bar.k-stopped{background:var(--faint);}
.gantt-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.gantt-marker.k-done{border-color:var(--accent2);color:var(--accent2);}
.gantt-marker.k-warn{border-color:#c98a1f;color:#c98a1f;}
.gantt-marker.k-stopped{border-color:var(--faint);color:var(--faint);background:#f1f2f4;}
.gantt-legend{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0 18px;}
.gantt-legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.gantt-legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
.view-toggle{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;}
.view-toggle button{font-family:var(--font-ui);font-size:12px;font-weight:600;padding:6px 12px;border:none;background:#fff;color:var(--muted);cursor:pointer;}
.view-toggle button.active{background:var(--accent);color:#fff;}
.gantt-co-picker{position:relative;}
.gantt-co-btn{font-family:var(--font-ui);font-size:12.5px;padding:7px 12px;border:1px solid var(--rule);border-radius:5px;background:#fff;color:var(--ink);cursor:pointer;}
.gantt-co-btn:hover{border-color:var(--accent);}
.gantt-co-panel{display:none;position:absolute;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid var(--rule);border-radius:6px;box-shadow:0 6px 20px rgba(17,24,39,.14);width:280px;z-index:40;padding:8px;}
.gantt-co-panel.open{display:block;}
.gantt-co-panel input{width:100%;font-family:var(--font-ui);font-size:12.5px;padding:7px 9px;border:1px solid var(--rule);border-radius:5px;margin-bottom:6px;}
.gantt-co-panel-list{max-height:260px;overflow-y:auto;}
.gantt-co-panel-row{display:flex;align-items:center;gap:8px;padding:6px 6px;font-size:12.5px;cursor:pointer;border-radius:4px;}
.gantt-co-panel-row:hover{background:#f2f6fa;}
.gantt-co-panel-row input{pointer-events:none;width:auto;margin:0;}
.gantt-co-panel-foot{display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--rule2);}
.gantt-co-panel-foot button{font-family:var(--font-ui);font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;}
/* ---- program detail (inside company drill-down modal system) ---- */
.pm-switcher{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.pm-switcher select{font-family:var(--font-ui);font-size:12.5px;padding:7px 9px;border:1px solid var(--rule);border-radius:5px;background:#fff;color:var(--ink);flex:1;min-width:160px;}
.pm-stage-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;margin-bottom:10px;}
.pm-stage-badge.k-done{background:#e4f4ef;color:#0a6b53;}
.pm-stage-badge.k-active{background:#eaf1fb;color:var(--accent);}
.pm-stage-badge.k-warn{background:#fdf0dc;color:#8a5a0f;}
.pm-stage-badge.k-stopped{background:#f1f2f4;color:var(--faint);}
.pm-note{font-size:11.5px;color:var(--faint);background:var(--bgsoft);border-radius:6px;padding:9px 11px;margin:10px 0;}
.pm-view-profile{font-family:var(--font-ui);font-size:12.5px;font-weight:600;padding:8px 14px;border:1px solid var(--accent);border-radius:5px;background:#fff;color:var(--accent);cursor:pointer;margin-top:6px;}
.pm-view-profile:hover{background:#eaf1fb;}

/* ---- pipeline timeline matrix (company x phase) ---- */
.mx-table{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed;}
.mx-table th,.mx-table td{border:1px solid var(--rule);padding:6px 7px;vertical-align:top;}
.mx-table thead th{background:var(--bgsoft);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);text-align:center;cursor:pointer;position:sticky;top:0;z-index:2;}
.mx-table thead th:hover{background:#eaf1fb;color:var(--accent);}
.mx-table th.mx-co-head{text-align:left;cursor:default;width:150px;}
.mx-table th.mx-co-head:hover{background:var(--bgsoft);color:var(--muted);}
.mx-table th.mx-total-head{cursor:default;width:60px;}
.mx-table th.mx-total-head:hover{background:var(--bgsoft);color:var(--muted);}
.mx-head-n{display:block;font-family:var(--font-num);font-size:12px;font-weight:700;color:var(--ink);margin-top:2px;}
.mx-co-cell{width:150px;}
.mx-co-cell.clickable{cursor:pointer;}
.mx-co-cell.clickable:hover .tkr{text-decoration:underline;}
.mx-co-cell .tkr{display:block;}
.mx-co-cell .nm{display:block;color:var(--faint);font-size:10px;font-weight:400;}
.mx-cell{min-width:118px;}
.mx-cell.mx-empty{color:var(--faint);text-align:center;vertical-align:middle;}
.mx-count{display:inline-block;font-family:var(--font-num);font-weight:700;font-size:10.5px;color:var(--ink);background:var(--bgsoft);border-radius:8px;padding:0 6px;margin-bottom:4px;}
.mx-drug{cursor:pointer;display:flex;align-items:flex-start;gap:5px;margin-bottom:3px;line-height:1.3;}
.mx-drug:last-child{margin-bottom:0;}
.mx-drug:hover span{color:var(--accent);text-decoration:underline;}
.mx-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;background:var(--accent);}
.mx-dot.k-done{background:var(--accent2);}
.mx-dot.k-warn{background:#c98a1f;}
.mx-dot.k-stopped{background:var(--faint);}
.mx-total-cell{text-align:center;font-family:var(--font-num);font-weight:700;color:var(--ink);background:var(--bgsoft);}
tr.mx-total-row td{font-weight:700;background:var(--bgsoft);text-align:center;font-family:var(--font-num);}
tr.mx-total-row td:first-child{text-align:left;font-family:var(--font-ui);}
@media (max-width:860px){
  .gantt-head,.gantt-row{grid-template-columns:140px repeat(9,1fr);}
  .gantt-head .gh-label{font-size:8.5px;writing-mode:vertical-rl;}
}

h2.sec{font-size:15px;font-weight:700;margin:30px 0 4px;display:flex;align-items:baseline;gap:8px;}
h2.sec .n{font-family:var(--font-num);font-size:12px;color:var(--accent);font-weight:500;}
h2.sec:first-child{margin-top:0;}
p.sec-note{margin:0 0 14px;font-size:12px;color:var(--faint);max-width:80ch;}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:8px;}
.tile{border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:5px;padding:12px 14px;background:var(--bgsoft);}
.tile .tn{font-family:var(--font-num);font-size:24px;font-weight:700;color:var(--ink);line-height:1.1;}
.tile .tl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:5px;}
.tile .td{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.4;}
.tile .bar-row{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;}
.tile .bar-row .lab{width:92px;flex-shrink:0;color:var(--muted);}
.tile .bar-row .bar{flex:1;background:var(--rule2);border-radius:3px;height:14px;overflow:hidden;}
.tile .bar-row .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;}
.tile .bar-row .val{width:22px;text-align:right;font-family:var(--font-num);color:var(--muted);flex-shrink:0;}

.hbar-chart{margin:4px 0 14px;}
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12.5px;}
.hbar-row .lab{width:260px;flex-shrink:0;color:var(--ink);}
.hbar-row .bar{flex:1;background:var(--rule2);border-radius:3px;height:18px;overflow:hidden;position:relative;}
.hbar-row .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;}
.hbar-row .val{width:28px;text-align:right;font-family:var(--font-num);font-weight:600;color:var(--ink);flex-shrink:0;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:7px 9px 7px 0;vertical-align:top;border-bottom:1px solid var(--rule);}
th{font-size:10.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--ink);position:sticky;top:0;background:var(--bg);}
tr.group-head td{font-weight:700;background:var(--bgsoft);border-bottom:1px solid var(--ink);padding-top:10px;padding-bottom:4px;color:var(--accent);font-size:12px;}
td.num,th.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap;}
.scroll{overflow-x:auto;margin-bottom:10px;}
.fin-co{font-size:12px;}
.fin-co .tkr{display:block;font-size:13px;}
.fin-co .nm{display:block;color:var(--faint);font-size:11px;font-weight:400;line-height:1.3;}
.fin-amt{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;color:var(--ink);line-height:1.25;white-space:nowrap;}
.fin-amt-sub{display:block;font-family:var(--font-ui);font-weight:400;font-size:10.5px;color:var(--faint);white-space:normal;margin-top:1px;}
.fin-wrap{max-width:220px;white-space:normal;font-size:12px;color:var(--muted);}
.fin-date{font-size:11px;color:var(--faint);white-space:nowrap;}
.tkr{font-family:var(--font-num);font-weight:700;color:var(--accent);}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap;margin:1px 2px 1px 0;}
.tag.gen{background:#e4f4ef;color:#0a6b53;}
.tag.cons{background:#f1f2f4;color:var(--faint);}
.tag.warn{background:#fdeceb;color:var(--red);}
.tag.neutral{background:#eaf1fb;color:var(--accent);}
.flag{font-size:11px;color:var(--red);}
sup.dcite{font-size:9.5px;line-height:0;margin-left:1px;cursor:pointer;color:var(--accent);font-weight:700;}
sup.dcite:hover{text-decoration:underline;}

.matrix{border-collapse:collapse;font-size:12.5px;margin-bottom:14px;}
.matrix th,.matrix td{border:1px solid var(--rule);padding:8px 10px;text-align:center;}
.matrix th{background:var(--bgsoft);font-size:10.5px;text-transform:uppercase;color:var(--muted);}
.matrix td.rowlab{text-align:left;font-weight:600;color:var(--ink);background:var(--bgsoft);}
.matrix td.cell{font-family:var(--font-num);font-weight:600;}
.matrix td.cell[data-n="0"]{color:var(--faint);font-weight:400;}

.watch-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:10px;}
.watch-card{border:1px solid var(--rule);border-left:3px solid var(--accent2);border-radius:5px;padding:12px 14px;}
.watch-card h4{margin:0 0 4px;font-size:13px;}
.watch-card h4 .tkr{font-size:12px;}
.watch-card p{margin:0 0 6px;font-size:12px;color:var(--muted);}
.watch-card .wmeta{font-size:10.5px;color:var(--faint);}

.filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;padding:10px 12px;background:var(--bgsoft);border:1px solid var(--rule);border-radius:6px;}
.filterbar label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-right:4px;}
.filterbar select{font-family:var(--font-ui);font-size:12.5px;padding:5px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);}
.filterbar .count{margin-left:auto;font-size:11.5px;color:var(--faint);}
.filterbar button{font-family:var(--font-ui);font-size:11.5px;padding:5px 10px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--muted);cursor:pointer;}
.filterbar button:hover{color:var(--ink);border-color:var(--ink);}

.ddl{margin-bottom:20px;}
.ddl dt{font-weight:600;color:var(--ink);margin-top:10px;font-size:12.5px;}
.ddl dd{margin:2px 0 0;color:var(--muted);font-size:12px;}
.log-item{border-left:3px solid var(--red);padding:6px 0 6px 12px;margin-bottom:8px;font-size:12.5px;}
.log-item b{color:var(--ink);}
.src-table td,.src-table th{font-size:11.5px;}
.foot-note{font-size:11px;color:var(--faint);margin-top:6px;}
tr:hover td{background:#fafbfc;}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:#eef4fa;}
tr.clickable:hover .tkr{text-decoration:underline;}
.tkr{cursor:pointer;}
.tkr:hover{text-decoration:underline;}
.watch-card{cursor:pointer;transition:box-shadow .12s, border-color .12s;}
.watch-card:hover{box-shadow:0 2px 10px rgba(17,24,39,.08);border-color:var(--accent2);}
.hbar-row{cursor:pointer;border-radius:4px;padding:2px 4px;margin-left:-4px;transition:background .12s;}
.hbar-row:hover{background:#f2f6fa;}
.hbar-row:hover .bar i{background:var(--accent2);}
.tile .bar-row{cursor:pointer;border-radius:4px;padding:1px 3px;margin-left:-3px;transition:background .12s;}
.tile .bar-row:hover{background:#eef2f6;}
.matrix td.cell[data-clickable="1"]{cursor:pointer;transition:background .12s;}
.matrix td.cell[data-clickable="1"]:hover{background:#eaf1fb;}
th[title], td[title]{text-decoration-style:dotted;}
.clickhint{font-size:10px;color:var(--faint);font-weight:400;text-transform:none;letter-spacing:0;}

/* ---- company drill-down modal ---- */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:50;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.modal-backdrop.open{display:flex;}
.modal-card{background:#fff;border-radius:8px;max-width:760px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);margin-bottom:40px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:2px solid var(--ink);}
.modal-head h3{margin:0;font-size:18px;}
.modal-head .tkr{font-size:14px;display:block;margin-bottom:2px;}
.modal-close{border:none;background:none;font-size:22px;line-height:1;color:var(--faint);cursor:pointer;padding:2px 6px;}
.modal-close:hover{color:var(--ink);}
.modal-body{padding:18px 22px 24px;}
.modal-body h4{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 6px;}
.modal-body h4:first-child{margin-top:0;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.modal-stat{font-family:var(--font-num);font-weight:700;font-size:15px;color:var(--ink);}
.modal-stat-sub{display:block;font-family:var(--font-ui);font-weight:400;font-size:11px;color:var(--faint);margin-top:1px;}
.modal-body ul{margin:0;padding-left:18px;font-size:12.5px;}
.modal-body li{margin-bottom:5px;}
.modal-body p{font-size:12.5px;margin:0 0 6px;}
.modal-flag{border-left:3px solid var(--red);padding:5px 0 5px 10px;margin-bottom:6px;font-size:12px;color:var(--muted);}
@media (max-width:720px){
  .hbar-row .lab{width:150px;font-size:11.5px;}
  table{font-size:11.5px;}
}

/* ============================================================
   TEARSHEET TAB — scoped under .tsheet-page so its element-level
   rules (table, p, ul, li, h2, h3, section...) never bleed into
   the rest of the dashboard.
   ============================================================ */
.tsheet-page{max-width:980px;margin:0 auto;padding-block:20px 48px;}
.tsheet-page .picker-bar{position:sticky;top:0;background:var(--bg);z-index:5;padding-block:10px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.tsheet-page .picker-bar label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.tsheet-page .picker-bar select{font-family:var(--font-ui);font-size:15px;font-weight:600;padding:7px 10px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);min-width:260px;}
.tsheet-page .picker-bar .count{font-size:11.5px;color:var(--faint);margin-left:auto;}
.tsheet-page header.masthead{border-bottom:2px solid var(--ink);padding-bottom:14px;padding-top:18px;}
.tsheet-page header h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-0.2px;text-wrap:balance;}
.tsheet-page .ticker{font-family:var(--font-num);font-size:14px;color:var(--accent);margin-left:8px;font-weight:500;}
.tsheet-page .meta{margin-top:8px;color:var(--muted);font-size:13px;}
.tsheet-page .meta span + span::before{content:"  /  ";color:var(--faint);}
.tsheet-page section{padding-block:22px;border-bottom:1px solid var(--rule);min-width:0;}
.tsheet-page section:last-of-type{border-bottom:none;}
.tsheet-page h2{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--ink);display:flex;gap:10px;align-items:baseline;}
.tsheet-page h2 .n{font-family:var(--font-num);font-size:12px;color:var(--accent);font-weight:500;}
.tsheet-page h3{margin:16px 0 6px;font-size:13px;font-weight:600;color:var(--muted);}
.tsheet-page p{margin:0 0 10px;max-width:72ch;}
.tsheet-page ul{margin:0;padding-left:18px;}
.tsheet-page li{margin-bottom:6px;max-width:72ch;}
.tsheet-page .lede{font-size:15px;color:var(--ink);}
.tsheet-page .note{font-size:12px;color:var(--faint);margin-top:8px;}
.tsheet-page .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
.tsheet-page .scroll{overflow-x:auto;}
.tsheet-page table{width:100%;border-collapse:collapse;font-size:13px;}
.tsheet-page th,.tsheet-page td{text-align:left;padding:7px 10px 7px 0;vertical-align:top;border-bottom:1px solid var(--rule);}
.tsheet-page th{font-size:11.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--ink);}
.tsheet-page td.r,.tsheet-page th.r{text-align:right;}
.tsheet-page td.num,.tsheet-page th.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
.tsheet-page tr.total td{font-weight:600;border-top:1px solid var(--ink);}
.tsheet-page .sm{font-size:12px;color:var(--muted);}
.tsheet-page .stage{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:1px 7px;margin-left:6px;vertical-align:2px;}
.tsheet-page .chart{margin:4px 0 6px;}
.tsheet-page .chart svg{width:100%;height:auto;display:block;overflow:visible;}
.tsheet-page .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;}
.tsheet-page .legend span{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;}
.tsheet-page .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.tsheet-page .badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 7px;border-radius:3px;white-space:nowrap;}
.tsheet-page .badge.b-done{background:#eaf1fb;color:var(--accent);}
.tsheet-page .badge.b-active{background:#e4f4ef;color:#0a6b53;}
.tsheet-page .badge.b-stopped{background:#f1f2f4;color:var(--faint);}
.tsheet-page .badge.b-early{background:#fbf3e2;color:#8a6a0f;}
.tsheet-page .badge.b-warn{background:#fdeceb;color:#a3281e;}
.tsheet-page .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:2px 0 16px;}
.tsheet-page .card{border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:4px;padding:10px 12px;min-width:0;}
.tsheet-page .card.warn{border-left-color:#a3281e;}
.tsheet-page .card .ch{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;color:var(--ink);line-height:1.3;}
.tsheet-page .card .cs{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4;}
.tsheet-page .quote{border-left:3px solid var(--rule);padding:2px 0 2px 12px;font-size:12.5px;color:var(--muted);font-style:italic;margin:8px 0;}
.tsheet-page sup.cite{font-size:10px;line-height:0;margin-left:1px;}
.tsheet-page sup.cite a{color:var(--accent);text-decoration:none;font-weight:600;}
.tsheet-page sup.cite a:hover{text-decoration:underline;}
.tsheet-page .src-list{list-style:none;margin:0;padding:0;counter-reset:srcnum;}
.tsheet-page .src-list li{counter-increment:srcnum;padding:5px 0 5px 28px;position:relative;font-size:12px;border-bottom:1px solid var(--rule);scroll-margin-top:60px;}
.tsheet-page .src-list li:last-child{border-bottom:none;}
.tsheet-page .src-list li::before{content:counter(srcnum) ".";position:absolute;left:0;top:5px;color:var(--accent);font-family:var(--font-num);font-weight:600;font-size:12px;}
.tsheet-page .src-list li:target{background:#fff6d8;}
.tsheet-page .src-list a{color:var(--accent);word-break:break-all;}
@media (max-width:640px){ .tsheet-page header h1{font-size:22px;} .tsheet-page .picker-bar select{min-width:0;flex:1;} }
</style>

function fmtM(v){ if (v===undefined||v===null) return "—"; var sign = v<0 ? "−" : ""; return sign+"$"+Math.abs(v).toFixed(1)+"M"; }

/* ===================== CITATIONS (filing facts only) =====================
   Block-level, same convention as the Company Tearsheets tab: each number
   traces to the specific 10-Q/10-K/8-K/6-K/20-F section it was taken from.
   Classifications (Stage, Hybrid, econ model, disease areas, concentration)
   are analytical judgments, not filing facts, and are not cited here — see
   the Methodology & Sources tab for how those are derived instead. */
function cite(ticker, field){
  var c = (CITATIONS[ticker] || {})[field];
  if (!c || !c.length) return "";
  return c.map(function(n){
    return '<sup class="dcite" data-cite-ticker="'+ticker+'" data-cite-src="'+n+'" title="Source '+n+' — click to view in Company Tearsheets">'+n+'</sup>';
  }).join("");
}
function gotoSource(ticker, srcNum){
  switchTab("tearsheets");
  var sel = document.getElementById("co-select");
  if (sel){
    sel.value = ticker;
    sel.dispatchEvent(new Event("change"));
  }
  setTimeout(function(){
    var el = document.getElementById("src-"+srcNum);
    if (el) el.scrollIntoView({behavior:"smooth", block:"center"});
  }, 60);
}
function splitAmount(label){
  var m = label.match(/^(~?\$[\d,.]+[MB])(.*)$/);
  if (!m) return { amt: label, rest: "" };
  return { amt: m[1], rest: m[2].replace(/^\s+/, "") };
}
function esc(s){ return (s===undefined||s===null) ? "" : String(s); }
function byTicker(a,b){ return a.t < b.t ? -1 : 1; }

function shortMat(m){
  return {
    "Marketed: Established":"Established",
    "Marketed: Recent Commercial":"Recent commercial",

var FILTER_STATE = { area:"", maturity:"", econ:"" };

function uniqueAreas(){
  var s = {};
  DATA.forEach(function(d){ d.areas.forEach(function(a){ s[a]=1; }); });
  return Object.keys(s).sort();
}
function filteredData(){
  return DATA.filter(function(d){
    if (FILTER_STATE.area && d.areas.indexOf(FILTER_STATE.area)===-1) return false;
    if (FILTER_STATE.maturity && d.maturity!==FILTER_STATE.maturity) return false;
    if (FILTER_STATE.econ && d.econ!==FILTER_STATE.econ) return false;
    return true;
  }).sort(byTicker);
}
function filterBarHtml(idPrefix){
  var areas = uniqueAreas();
  var econs = Array.from(new Set(DATA.map(function(d){return d.econ;})));
  var h = '<div class="filterbar">';
  h += '<label>Disease area</label><select id="'+idPrefix+'-area"><option value="">All</option>'+areas.map(function(a){return '<option value="'+esc(a)+'"'+(FILTER_STATE.area===a?' selected':'')+'>'+a+'</option>';}).join('')+'</select>';
  h += '<label>Maturity</label><select id="'+idPrefix+'-mat"><option value="">All</option>'+MATURITY_ORDER.map(function(m){return '<option value="'+esc(m)+'"'+(FILTER_STATE.maturity===m?' selected':'')+'>'+shortMat(m)+'</option>';}).join('')+'</select>';
  h += '<label>Economic model</label><select id="'+idPrefix+'-econ"><option value="">All</option>'+econs.map(function(e){return '<option value="'+esc(e)+'"'+(FILTER_STATE.econ===e?' selected':'')+'>'+shortEcon(e)+'</option>';}).join('')+'</select>';
  h += '<button id="'+idPrefix+'-reset">Clear filters</button>';
  h += '<span class="count" id="'+idPrefix+'-count"></span>';
  h += '</div>';
  return h;
}
function wireFilterBar(idPrefix, rerenderFn){
  document.getElementById(idPrefix+"-area").addEventListener("change", function(e){ FILTER_STATE.area=e.target.value; rerenderFn(); });
  document.getElementById(idPrefix+"-mat").addEventListener("change", function(e){ FILTER_STATE.maturity=e.target.value; rerenderFn(); });
  document.getElementById(idPrefix+"-econ").addEventListener("change", function(e){ FILTER_STATE.econ=e.target.value; rerenderFn(); });
  document.getElementById(idPrefix+"-reset").addEventListener("click", function(){ FILTER_STATE={area:"",maturity:"",econ:""}; rerenderFn(); });
}

/* ===================== METHODOLOGY TAB ===================== */
function renderMethodology(){
  var el = document.getElementById("tab-methodology");
  var html = "";
  html += '<h2 class="sec">Methodology &amp; sources</h2>';
  html += '<p class="sec-note">Based on each company\'s own SEC filings (10-Q, 10-K, 8-K, 6-K, or 20-F as applicable) for the periods and dates shown. No market data, analyst estimates, or external sources have been used.</p>';

  html += '<h3 style="font-size:13px;margin-top:20px;">Definitions</h3>';
  html += '<dl class="ddl">'
    + '<dt>Stage</dt><dd>Preclinical, Phase 1, Phase 2, Phase 3, Under Review, Marketed: Recent Commercial, Marketed: Established, or Cash shell / no lead asset. Set by the company\'s lead asset only — its single most advanced program, excluding any discontinued ones. A marketed lead is classified Established only if the company also has sustained positive operating cash flow and more than one marketed product; otherwise it is Recent Commercial, regardless of how long the product has actually been on the market. Phase 1/2 and Phase 2/3 trials are grouped with the later of the two phases.</dd>'
    + '<dt>Hybrid flag</dt><dd>An overlay on top of Stage, not a stage itself: true when a company has a marketed product and a separate Phase 3-or-later asset that is not its lead (e.g. a second major program still in late-stage development). Shown as a note, not folded into the Stage label.</dd>'
    + '<dt>Economic-participation model</dt><dd>Direct product sales · Mixed model (direct sales + royalties/milestones) · Collaboration profit/loss sharing · Pre-revenue / primarily milestone-or-licensing funded. Tracked independently of Stage — e.g. CRISPR Therapeutics\' lead asset (CASGEVY) is marketed, but its revenue is shared with partner Vertex rather than booked directly, which is captured here, not in the Stage label.</dd>'
    + '<dt>Operating cash-flow direction</dt><dd>Based on each company\'s reported six-month (H1 2026) net cash provided by/used in operating activities. One-time distortions (e.g., a divestiture gain or an acquisition-linked accounting charge) are noted alongside the affected company rather than netted out.</dd>'
    + '<dt>Disease-area counts</dt><dd>A company is counted once per disease area it is active in; totals exceed the company count where portfolios span multiple areas. Modality (drug class or technology platform) is shown separately.</dd>'
    + '<dt>Portfolio concentration</dt><dd>A qualitative assessment of whether a company\'s revenue and/or pipeline depends on one molecule or platform versus a diversified set — described in prose ("high," "moderate," "broad"), not scored numerically.</dd>'
    + '<dt>Milestone in next 12 months</dt><dd>Counted only where a company discloses a specific date or clearly bounded window (e.g., "Q4 2026," "1H 2027") for a concrete regulatory or clinical event, measured from '+REF_DATE+' through '+MILESTONE_WINDOW.split(" – ")[1]+'. Undated "ongoing" or "enrolling" programs are not counted.</dd>'
    + '<dt>Revenue growth comparisons</dt><dd>Not computed where the prior-year base was zero — labeled "no revenue" or "not meaningful" instead of an undefined percentage.</dd>'
    + '</dl>';

  html += '<h3 style="font-size:13px;margin-top:20px;">Source register</h3>';
  html += '<div class="scroll"><table class="src-table"><thead><tr><th>Ticker</th><th>Company</th><th>Reporting period</th></tr></thead><tbody>';
  DATA.slice().sort(byTicker).forEach(function(d){
    html += '<tr class="clickable" data-ticker="'+d.t+'" title="View full profile"><td><span class="tkr">'+d.t+'</span></td><td>'+d.name+'</td><td>'+d.period+'</td></tr>';
  });
  html += '</tbody></table></div>';

  html += '<h3 style="font-size:13px;margin-top:20px;">Notes &amp; qualifications</h3>';
  var log = [
    "<b>CASGEVY economics — CRISPR Therapeutics vs. Intellia.</b> CRISPR Therapeutics has partial CASGEVY economics via its Vertex collaboration (booked through “Collaboration expense, net,” not a revenue line). Intellia has no economic interest in CASGEVY. The two are frequently confused given both are CRISPR-based companies.",
    "<b>Fortress Biotech — one-time cash inflow.</b> H1 2026 operating cash flow of $144.6M is driven almost entirely by a one-time $158.9M priority-review-voucher sale, not a recurring operating trend.",
    "<b>Mirum Pharmaceuticals — acquisition accounting.</b> The H1 2026 net loss of $857.4M and resulting stockholders' deficit are almost entirely a one-time, non-cash $742.7M acquired-IPR&amp;D charge from the Bluejay Therapeutics acquisition, not a cash outflow or operating deterioration.",
    "<b>Janux Therapeutics — non-representative cash flow.</b> H1 2026 operating cash flow was a small net inflow, versus a $40.8M outflow a year earlier, due to a one-time BMS deferred-revenue swing. No single runway figure is reported for this company.",
    "<b>Tango Therapeutics — revenue base.</b> Collaboration revenue fell to zero after the Gilead agreement concluded in Aug 2025; no year-over-year revenue percentage is shown.",
    "<b>Karyopharm Therapeutics — active default.</b> Cash, revenue, and pipeline progress should be read in the context of an active loan-payment default and week-to-week forbearance (extended to Nov 1, 2026).",
    "<b>Heron Therapeutics — going concern.</b> The 10-Q's “at least one year” liquidity statement is conditioned on a lender waiver obtained shortly before filing; a mandatory post-quarter debt paydown leaves materially less cash than the $42.7M balance-sheet figure implies.",
    "<b>Pharming Group — reporting cycle.</b> A foreign private issuer reporting half-yearly under IFRS (6-K/20-F), not quarterly under US GAAP. Its H1 2026 period is comparable in kind, not calendar alignment, to the other companies' Q2 2026 figures.",
    "<b>Commercial maturity and economic model are independent dimensions.</b> An approved, partnered product does not imply direct product revenue (CRISPR Therapeutics), and direct product revenue does not imply positive operating cash flow (Ardelyx, MiMedx, Kura Oncology, and Heron all sell approved products but consumed cash in H1 2026)."
  ];
  var logHtml = log.map(function(l){ return '<div class="log-item">'+l+'</div>'; }).join('');
  html += '<div id="log-list">'+logHtml+'</div>';

  el.innerHTML = html;
}

var CMP_SELECTED = [];

function updateCompareBadge(){
  var badge = document.getElementById("compare-count");
  badge.textContent = CMP_SELECTED.length;
  badge.classList.toggle("show", CMP_SELECTED.length > 0);
}
function openCompareModal(){
  renderComparePicker("");
  document.getElementById("cmp-modal-backdrop").classList.add("open");
}
function closeCompareModal(){
  document.getElementById("cmp-modal-backdrop").classList.remove("open");
}
function renderComparePicker(query){
  var card = document.getElementById("cmp-modal-card");
  var list = DATA.slice().sort(byTicker);
  if (query && query.trim()){
    list = searchCompanies(query);
  }
  var atMax = CMP_SELECTED.length >= 3;
  var h = '';
  h += '<div class="modal-head"><div><h3>Compare companies</h3></div><button class="modal-close" id="cmp-modal-close" aria-label="Close">&times;</button></div>';
  h += '<div class="modal-body">';
  h += '<p style="color:var(--muted)">Pick 2 or 3 companies to compare side by side.</p>';
  h += '<input type="text" class="cmp-pick-search" id="cmp-pick-search" placeholder="Filter companies…" autocomplete="off" value="'+esc(query||"")+'">';
  h += '<div class="cmp-pick-list">';
  if (!list.length){
    h += '<div class="search-empty">No matching companies</div>';
  }
  list.forEach(function(d){
    var checked = CMP_SELECTED.indexOf(d.t) > -1;
    var disabled = !checked && atMax;
    h += '<div class="cmp-pick-row '+(checked?"checked":"")+' '+(disabled?"disabled":"")+'" data-cmp-ticker="'+d.t+'">'
       + '<input type="checkbox" '+(checked?"checked":"")+' '+(disabled?"disabled":"")+'>'
       + '<span class="tkr">'+d.t+'</span><span class="nm">'+d.name+'</span>'
       + '</div>';
  });
  h += '</div>';
  h += '<div class="cmp-pick-foot"><span class="hint">'+CMP_SELECTED.length+' of 3 selected (minimum 2)</span>'
     + '<button class="cmp-go-btn" id="cmp-go-btn" '+(CMP_SELECTED.length<2?"disabled":"")+'>Compare '+CMP_SELECTED.length+' &rarr;</button></div>';
  h += '</div>';
  card.innerHTML = h;

  document.getElementById("cmp-modal-close").addEventListener("click", closeCompareModal);
  document.getElementById("cmp-pick-search").addEventListener("input", function(e){ renderComparePicker(e.target.value); });
  card.querySelectorAll("[data-cmp-ticker]").forEach(function(row){
    row.addEventListener("click", function(){
      if (row.classList.contains("disabled")) return;
      var t = row.dataset.cmpTicker;
      var idx = CMP_SELECTED.indexOf(t);
      if (idx>-1) CMP_SELECTED.splice(idx,1); else if (CMP_SELECTED.length<3) CMP_SELECTED.push(t);
      updateCompareBadge();
      renderComparePicker(document.getElementById("cmp-pick-search").value);
    });
  });
  var goBtn = document.getElementById("cmp-go-btn");
  if (goBtn) goBtn.addEventListener("click", renderCompareResults);

  row("FY revenue guidance", function(d){ return d.fyGuidance+cite(d.t,"income"); });
  row("Operating cash flow (H1)", function(d){ return '<span class="tag '+(d.ocfDir==="generating"?"gen":"cons")+'">'+fmtM(d.ocfH1)+' — '+(d.ocfDir==="generating"?"generating":"consuming")+'</span>'+cite(d.t,"cashflow"); });
  row("Debt / commitments", function(d){ return d.debt+cite(d.t,"balance"); });
  row("Runway guidance", function(d){ return d.runwayMgmt+cite(d.t,"runway"); });

  section("Risk notes");
  row("Flags", function(d){ return d.flags.length ? d.flags.map(function(f){return '<div class="flag" style="margin-bottom:4px">⚑ '+f+'</div>';}).join('') : '<span style="color:var(--faint)">None noted</span>'; });

  h += '</tbody></table></div>';
  h += '</div>';
  card.innerHTML = h;
  document.getElementById("cmp-modal-close").addEventListener("click", closeCompareModal);
  document.getElementById("cmp-back-btn").addEventListener("click", function(){ renderComparePicker(""); });

        + '<div class="gantt-co-picker"><button class="gantt-co-btn" id="gantt-co-btn" type="button">Companies <span id="gantt-co-btn-count">(20/20)</span> &#9662;</button>'

function renderGanttCoPanel(query){
  var listEl = document.getElementById("gantt-co-panel-list");

  if (query && query.trim()) list = searchCompanies(query);

    return '<div class="gantt-co-panel-row" data-gantt-ticker="'+d.t+'"><input type="checkbox" '+(checked?"checked":"")+'><span class="tkr">'+d.t+'</span><span class="nm" style="color:var(--faint)">'+d.name+'</span></div>';
  }).join('') || '<div class="search-empty">No matching companies</div>';

function openPhaseModal(stageNum){

  var includedTickers = DATA.slice().sort(byTicker).map(function(d){return d.t;}).filter(function(t){ return TIMELINE_INCLUDED.indexOf(t)>-1; });
  var progs = PIPELINE.filter(function(p){ return p.stageNum===stageNum && TIMELINE_INCLUDED.indexOf(p.t)>-1; });
  var byTicker_ = {};
  progs.forEach(function(p){ (byTicker_[p.t] = byTicker_[p.t]||[]).push(p); });
  var companiesWithDrugs = Object.keys(byTicker_).length;

  var h = '';
  h += '<div class="modal-head"><div><h3>'+label+'</h3></div><button class="modal-close" id="co-modal-close" aria-label="Close">&times;</button></div>';
  h += '<div class="modal-body">';
  h += '<p style="color:var(--muted)">'+progs.length+' program'+(progs.length===1?"":"s")+' across '+companiesWithDrugs+' of '+includedTickers.length+' compan'+(includedTickers.length===1?"y":"ies")+(TIMELINE_INCLUDED.length<20 ? ' shown (within the current company filter)' : '')+'.</p>';
  if (!includedTickers.length){
    h += '<p class="sec-note">No companies currently selected in the Pipeline Timeline filter.</p>';
  } else {
    h += '<div class="scroll"><table><thead><tr><th style="width:160px">Company</th><th>Drugs at this stage</th></tr></thead><tbody>';
    includedTickers.forEach(function(t){
      var d = DATA.filter(function(x){return x.t===t;})[0];
      var list = byTicker_[t] || [];
      h += '<tr><td><span class="tkr" data-ticker="'+t+'" style="cursor:pointer" title="View full company profile">'+t+'</span><br><span style="color:var(--faint);font-size:11px">'+d.name+'</span></td>';
      if (!list.length){
        h += '<td style="color:var(--faint)">—</td></tr>';
      } else {
        h += '<td><b>'+list.length+'</b> drug'+(list.length>1?'s':'')+'<br>'
           + list.map(function(p){ return '<div class="cmp-drug-row" data-program-ticker="'+p.t+'" data-program-name="'+esc(p.program)+'" style="cursor:pointer"><span class="nm">'+esc(p.program)+'</span><span class="st">'+esc(p.indication)+'</span></div>'; }).join('')
           + '</td></tr>';
      }
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';
  document.getElementById("co-modal-card").innerHTML = h;
  document.getElementById("co-modal-backdrop").classList.add("open");
  document.getElementById("co-modal-close").addEventListener("click", closeCompanyModal);
}

/* ===================== PROGRAM DETAIL (drug-level drill-down) ===================== */
function programStatusNarrative(p){
  if (p.kind==="done") return "Approved and currently marketed, per the company's own tear sheet.";
  if (p.kind==="warn") return "Approved/marketed, but with a disclosed setback (e.g. a missed endpoint, patent challenge, or similar issue noted in the tear sheet).";
  if (p.kind==="stopped") return "Discontinued or deprioritized — development stopped at this stage; no further advancement planned.";
  return "In active development, currently at this stage per the company's most recent disclosure.";
}
function renderProgramDetail(ticker, programName){
  var d = DATA.filter(function(x){return x.t===ticker;})[0];
  if (!d) return;
  var companyProgs = PIPELINE.filter(function(p){return p.t===ticker;});
  var p = companyProgs.filter(function(x){return x.program===programName;})[0] || companyProgs[0];
  if (!p) return;

  var h = '';
  h += '<div class="modal-head"><div><span class="tkr">'+p.t+'</span><h3>'+esc(p.program)+'</h3></div><button class="modal-close" id="co-modal-close" aria-label="Close">&times;</button></div>';
  h += '<div class="modal-body">';
  h += '<div class="pm-switcher">';
  h += '<select id="pm-company-select">'+DATA.slice().sort(byTicker).map(function(x){return '<option value="'+x.t+'" '+(x.t===ticker?"selected":"")+'>'+x.t+' — '+x.name+'</option>';}).join('')+'</select>';
  h += '<select id="pm-program-select">'+companyProgs.map(function(x){return '<option value="'+esc(x.program)+'" '+(x.program===p.program?"selected":"")+'>'+esc(x.program)+'</option>';}).join('')+'</select>';
  h += '</div>';

  var kindClass = p.kind==="done"?"k-done":p.kind==="warn"?"k-warn":p.kind==="stopped"?"k-stopped":"k-active";
  h += '<span class="pm-stage-badge '+kindClass+'">'+STAGE_LABELS[p.stageNum]+'</span>';
  h += '<p><b>Indication:</b> '+esc(p.indication)+'</p>';
  h += '<p><b>Status:</b> '+programStatusNarrative(p)+'</p>';

  h += '<div class="pm-note">Per-drug sales, launch geography, and growth figures are not separately disclosed for most programs — companies generally report revenue at the product or consolidated level, not broken out this granularly. Where a program is a company\'s primary revenue driver, the company-level figures below are the closest available proxy.</div>';

  h += '<h4>Company snapshot (company-level financials)</h4>';
  h += '<div class="modal-grid">';
  h += '<div><span class="modal-stat">'+d.cashLabel+cite(d.t,"balance")+'</span><span class="modal-stat-sub">Cash, as of '+d.cashDate+'</span></div>';
  h += '<div><span class="modal-stat">'+fmtM(d.revH1)+cite(d.t,"income")+'</span><span class="modal-stat-sub">'+d.revDef+'</span></div>';
  h += '<div><span class="modal-stat">'+(d.ocfDir==="generating"?"Generating":"Consuming")+cite(d.t,"cashflow")+'</span><span class="modal-stat-sub">Operating cash flow (H1), '+fmtM(d.ocfH1)+'</span></div>';
  h += '<div><span class="modal-stat" style="font-size:12.5px;font-weight:600">'+d.fyGuidance+cite(d.t,"income")+'</span><span class="modal-stat-sub">FY revenue guidance</span></div>';
  h += '</div>';
  h += '<p style="margin-top:10px"><b>Commercial maturity:</b> '+d.maturity+' &middot; '+d.econ+'</p>';
  h += '<button class="pm-view-profile" id="pm-view-profile-btn">View full company profile &rarr;</button>';
  h += '</div>';

  document.getElementById("co-modal-card").innerHTML = h;
  document.getElementById("co-modal-backdrop").classList.add("open");
  document.getElementById("co-modal-close").addEventListener("click", closeCompanyModal);
  document.getElementById("pm-view-profile-btn").addEventListener("click", function(){ openCompanyModal(ticker); });
  document.getElementById("pm-company-select").addEventListener("change", function(e){
    var newTicker = e.target.value;
    var firstProg = PIPELINE.filter(function(x){return x.t===newTicker;})[0];
    renderProgramDetail(newTicker, firstProg ? firstProg.program : null);
  });
  document.getElementById("pm-program-select").addEventListener("change", function(e){
    renderProgramDetail(ticker, e.target.value);
  });
}

/* ===================== TABS ===================== */
var SUBTABS = ["financial","commercial","pipeline","strategic"];
function switchTab(name){
  document.querySelectorAll(".tab-btn[data-tab]").forEach(function(x){x.classList.toggle("active", x.dataset.tab===name);});

}
function closeCompDropdown(){
  var m = document.getElementById("comp-dropdown-menu");

}

    b.addEventListener("click", function(){ switchTab(b.dataset.tab); });

/* ===================== COMPANY SEARCH ===================== */
function fuzzyScore(query, text){
  query = (query||"").toLowerCase().trim();
  text = (text||"").toLowerCase();
  if (!query) return 0;
  if (text === query) return 110;
  if (text.indexOf(query) === 0) return 100;
  if (text.indexOf(" "+query) > -1) return 85;
  if (text.indexOf(query) > -1) return 70;
  var qi = 0;
  for (var i=0; i<text.length && qi<query.length; i++){
    if (text[i]===query[qi]) qi++;
  }
  if (qi===query.length) return Math.max(10, 40 - (text.length - query.length)*0.3);
  return 0;
}
function searchCompanies(query){
  return DATA.map(function(d){
    return { d:d, score: Math.max(fuzzyScore(query, d.t), fuzzyScore(query, d.name)) };
  }).filter(function(r){ return r.score>0; })
    .sort(function(a,b){ return b.score-a.score; })
    .slice(0,8)
    .map(function(r){ return r.d; });
}
function renderSearchResults(query){
  var box = document.getElementById("co-search-results");
  if (!query.trim()){ box.classList.remove("open"); box.innerHTML=""; return; }
  var matches = searchCompanies(query);
  if (!matches.length){
    box.innerHTML = '<div class="search-empty">No matching companies</div>';
  } else {
    box.innerHTML = matches.map(function(d){
      return '<div class="search-result-item" data-ticker="'+d.t+'"><span class="tkr">'+d.t+'</span><span class="nm">'+d.name+'</span></div>';
    }).join('');
  }
  box.classList.add("open");
}
function initSearch(){
  var input = document.getElementById("co-search");
  input.addEventListener("input", function(){ renderSearchResults(input.value); });
  input.addEventListener("focus", function(){ if (input.value.trim()) renderSearchResults(input.value); });
  input.addEventListener("keydown", function(e){
    if (e.key==="Escape"){ input.value=""; document.getElementById("co-search-results").classList.remove("open"); input.blur(); }
    if (e.key==="Enter"){
      var top = searchCompanies(input.value)[0];
      if (top){ openCompanyModal(top.t); input.value=""; document.getElementById("co-search-results").classList.remove("open"); input.blur(); }
    }
  });
}

/* ===================== COMPANY DRILL-DOWN MODAL ===================== */
function companyModalHtml(d){

  if (d.hybrid) h += '<p class="pm-note" style="margin-top:4px">Hybrid: marketed lead asset, plus a separate Phase 3-or-later program still in development — part of this company\'s valuation sits in the pipeline, not just the marketed base.</p>';
  h += '<p>'+d.areas.join(", ")+' &mdash; '+d.modality+'</p>';

  h += '<div><span class="modal-stat">'+d.cashLabel+cite(d.t,"balance")+'</span><span class="modal-stat-sub">As of '+d.cashDate+'</span></div>';
  h += '<div><span class="modal-stat">'+fmtM(d.ocfH1)+cite(d.t,"cashflow")+'</span><span class="modal-stat-sub">Operating cash flow (H1) &mdash; '+(d.ocfDir==="generating"?"generating":"consuming")+'</span></div>';
  h += '<div><span class="modal-stat">'+fmtM(d.revH1)+cite(d.t,"income")+'</span><span class="modal-stat-sub">'+d.revDef+'</span></div>';
  h += '<div><span class="modal-stat" style="font-size:12.5px;font-weight:600">'+d.debt+cite(d.t,"balance")+'</span></div>';
  h += '</div>';
  h += '<p style="margin-top:10px"><b>Runway guidance:</b> '+d.runwayMgmt+cite(d.t,"runway")+'</p>';
  h += '<p><b>Other funding sources:</b> '+d.fundingNotes+cite(d.t,"funding")+'</p>';

  h += '<h4>Pipeline &amp; milestones</h4>';
  h += '<p><b>Highest stage:</b> '+d.highestStage+cite(d.t,"pipeline")+'</p>';
  h += '<p><b>Concentration:</b> '+d.concentration+'</p>';
  h += '<p><b>Latest event:</b> '+d.latestEvent+cite(d.t,"trial")+'</p>';
  h += '<p><b>Next milestone:</b> '+d.nextMilestone+' &mdash; '+d.nextMilestoneDate+cite(d.t,"trial")+'</p>';

  h += '<h4>Strategic developments</h4>';
  h += '<ul>'+d.strategic.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>';

  if (d.flags.length){
    h += '<h4>Notes &amp; qualifications</h4>';
    h += d.flags.map(function(f){return '<div class="modal-flag">'+f+'</div>';}).join('');
  }
  h += '</div>';

}
function openCompanyModal(ticker){
  var d = DATA.filter(function(x){return x.t===ticker;})[0];
  if (!d) return;
  document.getElementById("co-modal-card").innerHTML = companyModalHtml(d);
  document.getElementById("co-modal-backdrop").classList.add("open");
  document.getElementById("co-modal-close").addEventListener("click", closeCompanyModal);
}
function closeCompanyModal(){
  document.getElementById("co-modal-backdrop").classList.remove("open");
}

/* ===================== GLOBAL CLICK DELEGATION ===================== */
function wireGlobalInteractions(){
  document.getElementById("co-modal-backdrop").addEventListener("click", function(e){
    if (e.target.id==="co-modal-backdrop") closeCompanyModal();
  });
  document.getElementById("cmp-modal-backdrop").addEventListener("click", function(e){
    if (e.target.id==="cmp-modal-backdrop") closeCompareModal();
  });
  document.getElementById("compare-btn").addEventListener("click", openCompareModal);
  document.addEventListener("keydown", function(e){
    if (e.key==="Escape"){ closeCompanyModal(); closeCompareModal(); closeCompDropdown(); }
  });
  document.addEventListener("click", function(e){
    if (!e.target.closest("#comp-dropdown")) closeCompDropdown();
    if (!e.target.closest("#gantt-co-picker") && !e.target.closest(".gantt-co-picker")){
      var gp = document.getElementById("gantt-co-panel");
      if (gp) gp.classList.remove("open");
    }
    if (!e.target.closest("#search-wrap")){
      document.getElementById("co-search-results").classList.remove("open");
    }

    var searchResult = e.target.closest("#co-search-results [data-ticker]");
    if (searchResult){
      openCompanyModal(searchResult.dataset.ticker);
      document.getElementById("co-search").value = "";
      document.getElementById("co-search-results").classList.remove("open");
      return;
    }

    var citeEl = e.target.closest("[data-cite-ticker]");
    if (citeEl){ gotoSource(citeEl.dataset.citeTicker, citeEl.dataset.citeSrc); return; }

    var tEl = e.target.closest("[data-ticker]");
    if (tEl){ openCompanyModal(tEl.dataset.ticker); return; }

    var progEl = e.target.closest("[data-program-ticker]");
    if (progEl){ renderProgramDetail(progEl.dataset.programTicker, progEl.dataset.programName); return; }

    var areaEl = e.target.closest("[data-filter-area]");
    if (areaEl){ FILTER_STATE = {area:areaEl.dataset.filterArea, maturity:"", econ:""}; switchTab("pipeline"); renderPipeline(); return; }

    var matEl = e.target.closest("[data-filter-maturity]");
    if (matEl){ FILTER_STATE = {area:"", maturity:matEl.dataset.filterMaturity, econ:""}; switchTab("financial"); renderFinancial(); return; }

    var econEl = e.target.closest("[data-filter-econ]");
    if (econEl){ FILTER_STATE = {area:"", maturity:"", econ:econEl.dataset.filterEcon}; switchTab("commercial"); renderCommercial(); return; }
  });
}

function boot(){
  renderOverview();
  renderFinancial();
  renderCommercial();
  renderPipeline();
  renderStrategic();
  renderMethodology();
  renderTimeline();
  updateCompareBadge();
  initTabs();
  initSearch();
  wireGlobalInteractions();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
</script>

<script>
(function(){
"use strict";

/* ============== shared render engine (same rules as the Spyre tearsheet) ============== */
function esc(s){ return (s===undefined||s===null) ? "" : String(s); }

function cardsRow(list){
  if (!list || !list.length) return "";
  return '<div class="cards">' + list.map(function(c){
    return '<div class="card'+(c.warn?' warn':'')+'"><div class="ch">'+c.h+cite(c.src)+'</div><div class="cs">'+c.s+'</div></div>';
  }).join("") + '</div>';
}

function bullets(list){
  if (!list || !list.length) return "";
  return '<ul>' + list.map(function(b){ return '<li>'+b+'</li>'; }).join("") + '</ul>';
}

function table(headers, rows, opts){
  opts = opts || {};
  var thead = '<thead><tr>' + headers.map(function(h){
    return '<th'+(h.r?' class="r num"':'')+'>'+h.label+'</th>';
  }).join("") + '</tr></thead>';
  var tbody = '<tbody>' + rows.map(function(row){
    var cls = row.total ? ' class="total"' : "";
    return '<tr'+cls+'>' + row.cells.map(function(c, i){
      var h = headers[i];
      var cls2 = h && h.r ? ' class="r num"' : "";
      return '<td'+cls2+'>'+c+'</td>';
    }).join("") + '</tr>';
  }).join("") + '</tbody>';
  return '<div class="scroll"><table>'+thead+tbody+'</table></div>';
}

function badge(text, kind){
  return '<span class="badge b-'+(kind||'active')+'">'+text+'</span>';
}

/* citation superscript: nums is an array of 1-based indices into the company's sources[] */
function cite(nums){
  if (!nums || !nums.length) return "";
  return '<sup class="cite">'+nums.map(function(n){ return '<a href="#src-'+n+'">'+n+'</a>'; }).join(',')+'</sup>';
}

function svgOpen(w,h){ return '<svg viewBox="0 0 '+w+' '+h+'" role="img">'; }

/* grouped vertical bar chart: categories x series */
function groupedBars(categories, series, unit, w, h){
  w=w||900; h=h||220;
  var padL=44,padR=10,padT=16,padB=30;
  var plotW=w-padL-padR, plotH=h-padT-padB;
  var max=0, min=0;
  series.forEach(function(s){ s.v.forEach(function(x){ if(x>max) max=x; if(x<min) min=x; }); });
  max*=1.15; if (min<0) min*=1.15;
  var range = max-min;
  var zeroY = h-padB-( (0-min)/range )*plotH;
  var groupW=plotW/categories.length;
  var barW=Math.min(34,(groupW-16)/series.length);
  var svg=svgOpen(w,h);
  svg+='<line x1="'+padL+'" y1="'+zeroY.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+zeroY.toFixed(1)+'" style="stroke:var(--rule);stroke-width:1"/>';
  categories.forEach(function(cat,ci){
    var gx=padL+ci*groupW+(groupW-barW*series.length)/2;
    series.forEach(function(s,si){
      var val=s.v[ci];
      var barH=Math.abs(val-0)/range*plotH;
      var x=gx+si*barW;
      var y = val>=0 ? zeroY-barH : zeroY;
      svg+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(barW-4).toFixed(1)+'" height="'+barH.toFixed(1)+'" rx="2" style="fill:'+s.c+'"/>';
      var labelY = val>=0 ? (y-4) : (y+barH+12);
      svg+='<text x="'+(x+(barW-4)/2).toFixed(1)+'" y="'+labelY.toFixed(1)+'" text-anchor="middle" style="font:9px var(--font-num);fill:var(--ink)">'+val.toFixed(1)+unit+'</text>';
    });
    svg+='<text x="'+(padL+ci*groupW+groupW/2).toFixed(1)+'" y="'+(h-padB+16).toFixed(1)+'" text-anchor="middle" style="font:10.5px var(--font-ui);fill:var(--muted)">'+cat+'</text>';
  });
  svg+='</svg>';
  var legend = series.length>1 ? '<div class="legend">'+series.map(function(s){ return '<span><i style="background:'+s.c+'"></i>'+s.name+'</span>'; }).join('')+'</div>' : '';
  return '<div class="chart">'+svg+legend+'</div>';
}

/* horizontal bar chart: rows = [{label, value, max, display, color}] */
function hBars(rows, w, h){
  w=w||780; var rowH=34; h=h||(rows.length*rowH+20);
  var labelW=170, padR=10;
  var plotW=w-labelW-padR;
  var max=0; rows.forEach(function(r){ if(r.value>max) max=r.value; });
  max = rows[0].scaleMax || max*1.15;
  var svg=svgOpen(w,h);
  rows.forEach(function(r,i){
    var y=i*rowH+8;
    var bw=(r.value/max)*plotW;
    svg+='<text x="0" y="'+(y+13)+'" style="font:11px var(--font-ui);fill:var(--ink)">'+r.label+'</text>';
    svg+='<rect x="'+labelW+'" y="'+y+'" width="'+bw.toFixed(1)+'" height="18" rx="2" style="fill:'+(r.color||'var(--accent)')+'"/>';
    svg+='<text x="'+(labelW+bw+6).toFixed(1)+'" y="'+(y+13)+'" style="font:10px var(--font-num);fill:var(--ink)">'+r.display+'</text>';
  });
  svg+='</svg>';
  return '<div class="chart">'+svg+'</div>';
}

/* dot plot: rows = [{name, min, max, unit, points:[{v,series}]}], seriesNames/colors */
function dotPlot(rows, seriesNames, colors, w, h){
  w=w||900; var padL=190,padR=30,padT=10,padB=22;
  h=h||(rows.length*46+padT+padB);
  var rowH=(h-padT-padB)/rows.length;
  var svg=svgOpen(w,h);
  rows.forEach(function(r,ri){
    var y0=padT+ri*rowH, yC=y0+rowH/2;
    svg+='<text x="0" y="'+(yC+4)+'" style="font:11.5px var(--font-ui);fill:var(--ink)">'+r.name+'</text>';
    svg+='<line x1="'+padL+'" y1="'+yC+'" x2="'+(w-padR)+'" y2="'+yC+'" style="stroke:var(--rule);stroke-width:1"/>';
    r.points.forEach(function(p,pi){
      var frac=(p.v-r.min)/(r.max-r.min);
      var x=padL+frac*(w-padL-padR);
      var dy=yC-10+pi*10;
      svg+='<line x1="'+x.toFixed(1)+'" y1="'+yC+'" x2="'+x.toFixed(1)+'" y2="'+dy+'" style="stroke:var(--rule);stroke-width:1"/>';
      svg+='<circle cx="'+x.toFixed(1)+'" cy="'+dy+'" r="4.5" style="fill:'+colors[p.series]+'"><title>'+seriesNames[p.series]+': '+r.name+' = '+p.v+(r.unit||'')+'</title></circle>';
      svg+='<text x="'+x.toFixed(1)+'" y="'+(dy-7)+'" text-anchor="middle" style="font:9px var(--font-num);fill:var(--ink)">'+p.v+(r.unit||'')+'</text>';
    });
  });
  svg+='</svg>';
  var legend='<div class="legend">'+ seriesNames.map(function(n,i){return '<span><i style="background:'+colors[i]+'"></i>'+n+'</span>';}).join('')+'</div>';
  return '<div class="chart">'+svg+legend+'</div>';
}

/* ============== section builders ============== */
function renderSection1(d){
  return '<section><h2><span class="n">1</span>Profile</h2>'+
    '<p class="lede">'+d.profile.lede+'</p>'+
    (d.profile.sub ? '<p class="sm">'+d.profile.sub+'</p>' : '') +
    '</section>';
}
function renderSection2(d){
  return '<section><h2><span class="n">2</span>One-minute read</h2>'+
    cardsRow(d.cards2) + bullets(d.bullets2) + '</section>';
}
function renderSection3(d){
  var body = (d.pipelineNote ? '<p class="sm">'+d.pipelineNote+'</p>' : '');
  if (d.pipelineCard) body += cardsRow([d.pipelineCard]);
  d.pipelineGroups.forEach(function(g){
    if (g.title) body += '<h3>'+g.title+cite(g.src)+'</h3>';
    body += table(g.headers, g.rows);
  });
  if (d.pipelineSourceNote) body += '<p class="note">'+d.pipelineSourceNote+cite(d.pipelineSrc)+'</p>';
  return '<section><h2><span class="n">3</span>Clinical development pipeline</h2>'+body+'</section>';
}
function renderSection4(d){
  var body = "";
  if (d.trial.narrative) body += '<p class="sm">'+d.trial.narrative+'</p>';
  (d.trial.blocks||[]).forEach(function(b){
    if (b.heading) body += '<h3>'+b.heading+cite(b.src)+'</h3>';
    if (b.chartType === 'dot') body += dotPlot(b.rows, b.seriesNames, b.colors, b.w, b.h);
    if (b.chartType === 'bar') body += groupedBars(b.categories, b.series, b.unit, b.w, b.h);
    if (b.table) body += table(b.table.headers, b.table.rows);
    if (b.note) body += '<p class="note">'+b.note+cite(b.noteSrc)+'</p>';
  });
  return '<section><h2><span class="n">4</span>Clinical trial results summary</h2>'+body+'</section>';
}
function renderSection5(d){
  var body = "";
  d.financials.forEach(function(f){
    body += '<h3>'+f.heading+cite(f.src)+'</h3>';
    if (f.card) body += cardsRow([f.card]);
    if (f.note1) body += '<p class="note">'+f.note1+'</p>';

/* ============== boot ============== */
function boot(){
  var sel = document.getElementById("co-select");
  var tickers = Object.keys(window.COMPANIES);
  tickers.forEach(function(t){
    var o = document.createElement("option");
    o.value = t; o.textContent = t + " — " + window.COMPANIES[t].name;
    sel.appendChild(o);
  });
  document.getElementById("co-count").textContent = tickers.length + " companies";
  function render(){
    var d = window.COMPANIES[sel.value];
    document.getElementById("tearsheet-root").innerHTML = d ? renderCompany(d) : '<p style="padding:20px;color:var(--faint)">No data loaded.</p>';
  }
  sel.addEventListener("change", render);
  if (tickers.length) { sel.value = tickers[0]; render(); }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
